bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

    navigators: ["navigate_to_pose", "navigate_through_poses"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_remove_passed_goals_action_bt_node

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code


bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true


bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 10.0
    odom_topic: /odom

    costmap_update_timeout: 0.5

    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.05

    failure_tolerance: 0.4

    use_realtime_priority: false

    enable_stamped_cmd_vel: false

    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController

      time_steps: 40
      model_dt: 0.1
      batch_size: 1200

      vx_std: 0.35
      vy_std: 0.0
      wz_std: 0.7

      vx_max: 0.6
      vx_min: -0.2
      vy_max: 0.0
      wz_max: 1.0

      iteration_count: 1
      prune_distance: 2.0
      transform_tolerance: 0.2

      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      regenerate_noises: true
      visualize: false

      AckermannConstraints:
        min_turning_r: 0.05

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        critical_cost: 253.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 3.2

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.2
        trajectory_point_step: 4
        threshold_to_consider: 1.0
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 5
        threshold_to_consider: 3.2

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5

      update_frequency: 10.0
      publish_frequency: 5.0

      width: 8
      height: 8
      resolution: 0.04

      always_send_full_costmap: true
      rolling_window: true

      footprint: '[[-0.45, -0.45], [-0.45, 0.45], [0.45, 0.45], [0.45, -0.45]]'

      plugins: ["stvl_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 1.8

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true

        voxel_decay: 8.0
        decay_model: 0
        voxel_size: 0.05

        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0

        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0

        publish_voxel_map: true
        transform_tolerance: 0.5

        mapping_mode: false
        map_save_duration: 60.0

        observation_sources: laserscan

        laserscan:
          data_type: LaserScan
          topic: /scan
          marking: true
          clearing: true

          obstacle_range: 6.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          expected_update_rate: 10.0
          observation_persistence: 2.0
          inf_is_valid: false

          filter: "voxel"
          voxel_min_points: 1
          clear_after_reading: true

          max_z: 2.5
          min_z: 0.05

          decay_acceleration: 5.0
          model_type: 0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5

      update_frequency: 2.0
      publish_frequency: 1.0

      width: 50
      height: 50
      resolution: 0.05

      footprint: '[[-0.45, -0.45], [-0.45, 0.45], [0.45, 0.45], [0.45, -0.45]]'

      always_send_full_costmap: false
      rolling_window: true
      track_unknown_space: true

      plugins: ["stvl_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.3
        inflation_radius: 1.8
        inflate_around_unknown: false
        inflate_unknown: false

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true

        voxel_decay: 15.0
        decay_model: 0
        voxel_size: 0.05

        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0

        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0

        publish_voxel_map: false
        transform_tolerance: 0.2

        mapping_mode: false
        map_save_duration: 60.0

        observation_sources: laserscan

        laserscan:
          data_type: LaserScan
          topic: /scan
          marking: true
          clearing: true

          obstacle_range: 12.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          expected_update_rate: 10.0
          observation_persistence: 2.0
          inf_is_valid: false

          filter: "voxel"
          voxel_min_points: 1 #2
          clear_after_reading: true

          max_z: 2.5
          min_z: 0.05

          decay_acceleration: 5.0
          model_type: 0


map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true


planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D

      tolerance: 0.125

      downsample_costmap: false
      downsampling_factor: 1

      allow_unknown: true

      max_iterations: 600000
      max_on_approach_iterations: 500
      max_planning_time: 3.0

      cost_travel_multiplier: 3.0

      use_final_approach_orientation: false

      smoother:
        max_iterations: 500
        w_smooth: 0.2
        w_data: 0.2
        tolerance: 1.0e-6


smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0

    enable_stamped_cmd_vel: false

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - assisted_teleop
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 5


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false

    # Use CLOSED_LOOP only if odometry twist is stable.
    feedback: "CLOSED_LOOP"

    max_velocity: [0.6, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]

    max_accel: [1.2, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]

    odom_topic: /odom
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0


map_autosaver:
  ros__parameters:
    use_sim_time: true
    autosave_period: 15.0
    map_directory: /maps/map